[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rig"
version = "0.5.0"
description = "Declarative wraparound: symlinks + your system package manager"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Grae Ceney" }]
keywords = ["dotfiles", "package-manager", "symlinks", "declarative", "config"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = ["argcomplete>=3.0", "tomlkit>=0.15"]

[project.urls]
Homepage = "https://github.com/graecen8/rig"
Repository = "https://github.com/graecen8/rig"
Changelog = "https://github.com/graecen8/rig/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
rig = "rig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
